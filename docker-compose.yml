name: adi-mcp

services:
  # Local Postgres instance for developing/testing the postgres provider.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adi_mcp
    ports:
      - '5432:5432'
    volumes:
      - adi-mcp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # The MCP server itself, running under `wrangler dev` (Miniflare emulates
  # KV/Workers runtime locally — no separate emulator container needed).
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    working_dir: /workspace
    command: pnpm --filter server dev --ip 0.0.0.0
    ports:
      - '8787:8787' # wrangler dev
      - '9229:9229' # node inspector, if attached
    env_file:
      - apps/server/.dev.vars
    volumes:
      - .:/workspace
      - adi-mcp-node-modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  adi-mcp-postgres-data:
  adi-mcp-node-modules:
